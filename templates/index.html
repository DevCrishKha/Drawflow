<!DOCTYPE html>
<html>

<head>
    <title>Drawflow Test</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <style>

    </style>
    <style>

    </style>
</head>

<body>
    <button onclick="send_to_flask()">SEND</button>
    <div id="palette">
        <div class="component" draggable="true" data-type="ESP32">ESP32</div>
        <div class="component" draggable="true" data-type="Potentiometer">Potentiometer</div>
        <div class="component" draggable="true" data-type="ADC Read">ADC Read</div>
        <div class="component" draggable="true" data-type="Mapper">Mapper</div>
        <div class="component" draggable="true" data-type="Servo">Servo</div>
        <div class="component" draggable="true" data-type="LED">LED</div>
        <div class="component" draggable="true" data-type="Flask">Flask</div>
        <div class="component" draggable="true" data-type="Frontend">Frontend</div>
        <div class="component" draggable="true" data-type="Database">Database</div>
    </div>
    <div class="modal-header">
        <h2 id="modal-node-title">Node Details</h2>
        <button id="modal-close" class="modal-close-btn">&times;</button>
    </div>

    <div id="drawflow"></div>

    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='JS/editor.js') }}"></script>
</body>

</html>
